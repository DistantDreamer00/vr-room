<DOCTYPE html></DOCTYPE>

<html>
    <head>
        <title>My first XR experience</title>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>

    <body>
<a-scene>
<a-box
position="2 3 -4"
rotation="0 45 0"
scale="1.5 0.5 1.5"
color="tomato">
</a-box>

<a-sphere
position="2 1.25 -5"
radius="1.25"
color="skyblue">
</a-sphere>

<a-plane
position="0 0 -4"
rotation="-90 0 0"
width="20"
height="20"
color="#cccccc">
</a-plane>

<a-text
value="welcome to XR"
position="1.8 3 -4"
color="white"
width="5">
</a-text>

<a-sky color="#87ceeb"></a-sky>

</a-scene>
</body>
</html>
